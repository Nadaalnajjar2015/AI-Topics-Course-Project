# Render Blueprint for the Regulatory & Support Copilot (free web service).
# In Render: New > Blueprint > this repo > Blueprint Path: projects/Regulatory-Support-Copilot/render.yaml
# Secrets (sync: false) are entered in the Render dashboard and never stored in Git.
services:
  - type: web
    name: regulatory-support-copilot
    runtime: python
    plan: free
    rootDir: projects/Regulatory-Support-Copilot
    buildCommand: pip install -r requirements.txt && python -m part2_knowledge.knowledge_base.ingest
    startCommand: python -m part5_web.serve
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ACTIVE_TEMPLATE
        value: payments
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_MAX_RETRIES
        value: "3"
      - key: GROQ_API_KEY
        sync: false
      - key: SITE_PASSWORD
        sync: false
